usage       = "field taylor-green --n 64 | fluid --method rk4 --nu 0.1 --dt 0.01 --t-end 1 --every 0.1 --out artifacts/taylor-green"
description = "integrate the field on stdin with a chosen time integrator, record frames; no unstated defaults"

[args]
method = "time integrator: euler, rk2, or rk4"
nu     = "kinematic viscosity"
dt     = "time step"
t-end  = "final integration time"

every = "time between snapshots; save at step 0 and every round(every/dt) steps after that; a step is never shortened to land on a snapshot"
out   = "output folder"

[writes]
stdout = "a header, then one tab-separated line per snapshot: t, E (energy), Z (enstrophy); the run stops at the first non-finite energy, prints that line, and exits 1"

"<out>/run.json"     = "case, n, seed, k_band as piped; method, nu, dt, t_end, snapshot_every"
"<out>/fields.jsonl" = "per snapshot stored before the run stopped: t, step, u, v, omega as n*n arrays, 6 decimals"
