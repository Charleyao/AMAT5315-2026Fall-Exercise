[package]
name = "seismic"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lib]
name = "seismic"
path = "src/lib.rs"

[[bin]]
name = "seismic"
path = "src/main.rs"
test = false
